name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -v

      - name: Build wheel and sdist
        run: python -m build

      - name: Strict Twine metadata check
        run: twine check --strict dist/*

      - name: Isolated wheel install and stdio MCP smoke test
        run: |
          python -m venv /tmp/fb-wheel-smoke
          /tmp/fb-wheel-smoke/bin/pip install --upgrade pip
          /tmp/fb-wheel-smoke/bin/pip install dist/*.whl
          /tmp/fb-wheel-smoke/bin/python - <<'PY'
          import asyncio, os, tempfile
          from fastmcp import Client
          from fastmcp.client.transports import StdioTransport

          async def smoke():
              with tempfile.TemporaryDirectory() as tmp:
                  transport = StdioTransport(
                      command="/tmp/fb-wheel-smoke/bin/forever-brain-mcp",
                      args=[],
                      env={**os.environ, "FOREVER_BRAIN_DIR": tmp},
                  )
                  async with Client(transport) as client:
                      tools = await client.list_tools()
                      names = {t.name for t in tools}
                      expected = {
                          "brain_startup",
                          "brain_remember",
                          "brain_correct",
                          "brain_recall",
                          "brain_trace",
                          "brain_health",
                      }
                      assert expected.issubset(names), f"Missing tools: {expected - names}"
                      health = await client.call_tool("brain_health", {})
                      assert health.data["status"] == "ok", f"Unexpected health: {health.data}"
                      print("CI STDIO SMOKE PASSED:", sorted(names))

          asyncio.run(smoke())
          PY
