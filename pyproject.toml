[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "forever-brain-mcp"
version = "0.1.0"
description = "Local-first, encrypted, source-attributed, bi-temporal memory MCP server for Hermes, Claude, Cursor, Codex, and Antigravity."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NextArk" }]
keywords = ["mcp", "fastmcp", "hermes", "memory", "ai-agents", "forever-brain"]
dependencies = [
    "fastmcp>=2.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
forever-brain-mcp = "forever_brain_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forever_brain_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = ["**/__pycache__", "**/*.pyc"]
